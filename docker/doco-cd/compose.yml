# GitOps para Docker Compose en la torre: consulta los repos y despliega sus .doco-cd.yml.
# No lo despliega doco-cd a sí mismo; lo instala infraestructure/tower.yml.
# More info at https://doco.cd/latest/
services:
  doco-cd:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.129.1
    restart: unless-stopped
    environment:
      TZ: 'Europe/Madrid'
      # Token de solo lectura para repos privados (vacío para los públicos)
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN:-}
      POLL_CONFIG: |
        - url: https://github.com/pabpereza/homelab.git
          reference: main
          interval: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    cap_drop:
      - ALL
    healthcheck:
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  data:
