# Nginx Proxy Manager: reverse proxy with Let's Encrypt on the tower's 80/443.
# Admin UI on :81 (LAN/Tailscale only, not forwarded by the router). The first visit shows the
# setup wizard to create the admin user. Proxy hosts reach the tower's services through
# host.docker.internal.
# More info at https://nginxproxymanager.com/setup/
services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2.16.0
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: 'Europe/Madrid'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt
volumes:
  data:
  letsencrypt:
