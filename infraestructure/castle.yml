---
# Prepara la torre (Arch/Omarchy) para los servicios de docker/ e instala doco-cd,
# que a partir de ahí los despliega solo desde git (ver .doco-cd.yml).
# La torre pide contraseña de sudo: ejecutar con -K.
- name: Torre
  hosts: castle
  become: true
  vars:
    doco_cd_dir: /opt/doco-cd
  tasks:
    # Omarchy deja Docker activado solo por socket: sin esto los contenedores no arrancan tras reiniciar
    - name: Arrancar Docker al inicio
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # Red de eno1: 192.168.1.250 por DHCP (reservada en el router; los puertos 80/443 del router
    # apuntan a ella) y 192.168.2.100 fija como dirección adicional, que es la que usa el inventario.
    - name: Red de la torre (DHCP + IP fija adicional)
      ansible.builtin.shell: |
        c=$(nmcli -g GENERAL.CONNECTION device show eno1)
        want="auto|192.168.2.100/16|192.168.1.1|yes|1.1.1.1,1.0.0.1"
        have="$(nmcli -g ipv4.method connection show "$c")|$(nmcli -g ipv4.addresses connection show "$c")|$(nmcli -g ipv4.gateway connection show "$c")|$(nmcli -g ipv4.ignore-auto-dns connection show "$c")|$(nmcli -g ipv4.dns connection show "$c")"
        if [ "$have" != "$want" ]; then
          nmcli connection modify "$c" ipv4.method auto ipv4.addresses 192.168.2.100/16 \
            ipv4.gateway 192.168.1.1 ipv4.ignore-auto-dns yes ipv4.dns "1.1.1.1,1.0.0.1"
          nmcli device reapply eno1
          echo changed
        fi
      register: tower_net
      changed_when: "'changed' in tower_net.stdout"

    - name: Arrancar SSH al inicio
      ansible.builtin.systemd:
        name: sshd
        enabled: true
        state: started

    # ufw es stateful: con el valor por defecto (120 s) se pierden los reportes de los dispositivos Matter a pilas
    - name: Timeout de conntrack UDP para Matter
      ansible.posix.sysctl:
        name: net.netfilter.nf_conntrack_udp_timeout_stream
        value: "3600"
        sysctl_file: /etc/sysctl.d/90-matter.conf

    # Acceso remoto (sobre todo a Home Assistant) sin abrir puertos en el router.
    # El login es manual la primera vez: sudo tailscale up
    - name: Instalar Tailscale
      community.general.pacman:
        name: tailscale
        state: present

    - name: Arrancar Tailscale al inicio
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    # Nodo de salida + rutas a la LAN. No cambia nada hasta que un cliente elige la torre como exit node
    # o activa "usar subredes" en la app. Exit node y rutas se aprueban una vez en la consola de Tailscale.
    # Solo IPv4: el reenvío IPv6 se deja desactivado porque Matter/Thread lo necesita así.
    - name: Reenvío IPv4 para Tailscale
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/90-tailscale.conf

    - name: Anunciar exit node y subredes de casa
      ansible.builtin.command: >-
        tailscale set --advertise-exit-node
        --advertise-routes=192.168.1.0/24,192.168.2.0/24
      changed_when: false

    # Escritorio remoto: Sunshine (servidor) + Moonlight (cliente). Captura el Hyprland real por KMS
    # (el paquete ya da cap_sys_admin al binario) y codifica con NVENC. Solo LAN y Tailscale.
    - name: Instalar Sunshine
      community.general.pacman:
        name: sunshine
        state: present

    - name: Arrancar Sunshine con la sesión del usuario
      become: false
      ansible.builtin.systemd:
        name: app-dev.lizardbyte.app.Sunshine.service
        scope: user
        enabled: true
        state: started
      environment:
        XDG_RUNTIME_DIR: /run/user/1000

    - name: Directorio de media (Emby y Transmission)
      ansible.builtin.file:
        path: /home/pabpereza/media
        state: directory
        owner: pabpereza
        group: pabpereza
        mode: "0755"

    - name: Directorio de doco-cd
      ansible.builtin.file:
        path: "{{ doco_cd_dir }}"
        state: directory
        mode: "0755"

    # Secretos de los servicios (env_file en los compose); doco-cd los monta en solo lectura
    - name: Directorios de secretos
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /opt/secrets
        - /opt/secrets/postiz
        - /opt/secrets/ddns

    - name: Compose de doco-cd
      ansible.builtin.copy:
        src: ../docker/doco-cd/compose.yml
        dest: "{{ doco_cd_dir }}/compose.yml"
        mode: "0644"
      register: doco_cd_compose

    - name: Levantar doco-cd
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ doco_cd_dir }}"
      when: doco_cd_compose.changed

    # Homebridge y Home Assistant usan network_mode: host, así que (a diferencia de los puertos publicados por Docker) pasan por ufw
    - name: Comprobar si ufw está activo
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Abrir los puertos de Homebridge y Home Assistant en ufw
      community.general.ufw:
        rule: allow
        from_ip: 192.168.0.0/16
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "8581", proto: tcp }    # UI
        # Bridge HomeKit y child bridges: bridge.port y _bridge.port en config.json
        - { port: "51168", proto: tcp }
        - { port: "59182", proto: tcp }
        - { port: "31477", proto: tcp }
        - { port: "8123", proto: tcp }    # Home Assistant
        - { port: "5353", proto: udp }    # mDNS
      when: "'Status: active' in ufw_status.stdout"

    # Lo que llega por la tailnet ya está autenticado; quién accede se limita con las ACLs de Tailscale
    # ufw-docker (viene con Omarchy) descarta las conexiones nuevas desde IPs públicas hacia los
    # contenedores; NPM es la única entrada pública.
    - name: Permitir el tráfico de Internet hacia NPM (80/443) en ufw-docker
      community.general.ufw:
        rule: allow
        route: true
        proto: tcp
        to_port: "{{ item }}"
        comment: "NPM {{ item }} (ufw-docker)"
      loop: ["80", "443"]
      when: "'Status: active' in ufw_status.stdout"

    - name: Abrir los puertos de Sunshine a la LAN en ufw
      community.general.ufw:
        rule: allow
        from_ip: 192.168.0.0/16
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: Sunshine
      loop:
        - { port: "47984", proto: tcp }        # HTTPS (emparejamiento)
        - { port: "47989", proto: tcp }        # HTTP
        - { port: "47990", proto: tcp }        # web de administración
        - { port: "48010", proto: tcp }        # RTSP
        - { port: "47998:48000", proto: udp }  # vídeo, control y audio
        - { port: "48010", proto: udp }
      when: "'Status: active' in ufw_status.stdout"

    - name: Permitir el tráfico de Tailscale en ufw
      community.general.ufw:
        rule: allow
        direction: in
        interface: tailscale0
      when: "'Status: active' in ufw_status.stdout"

    - name: Permitir que el tráfico de Tailscale salga a la LAN e Internet (exit node y subredes)
      community.general.ufw:
        rule: allow
        route: true
        interface_in: tailscale0
      when: "'Status: active' in ufw_status.stdout"
