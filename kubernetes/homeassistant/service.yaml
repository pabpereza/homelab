# Home Assistant corre en Docker en la torre (docker/homeassistant). Service sin selector + EndpointSlice
# para que homeassistant.pabpereza.dev siga funcionando a través de Traefik.
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
spec:
  ports:
    - name: web
      port: 8123
      targetPort: 8123
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant-tower
  labels:
    kubernetes.io/service-name: homeassistant
addressType: IPv4
ports:
  - name: web
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.2.100
