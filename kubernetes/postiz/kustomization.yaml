apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postiz
resources:
  - pvc.yaml
  - postgres.yaml
  - redis.yaml
  - elasticsearch.yaml
  - temporal.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: temporal-dynamicconfig
    files:
      - development-sql.yaml=temporal-dynamicconfig.yaml
# Secrets "postiz-secrets" and "postiz-providers" are created manually (see README.md).
