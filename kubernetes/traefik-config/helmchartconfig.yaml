apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
        experimentalChannel: true
    gateway:
      enabled: true
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      # Everything is served over HTTPS. Port 80 stays open only to redirect and for Let's
      # Encrypt HTTP-01 challenges (Let's Encrypt follows the redirect to HTTPS).
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      dnstcp:
        port: 53
        exposedPort: 53
        protocol: TCP
        expose:
          default: true
      dnsudp:
        port: 53
        exposedPort: 53
        protocol: UDP
        expose:
          default: true
